name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          check-latest: true
      - name: go vet (host)
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: cross build + vet (windows amd64/386/arm64)
        run: |
          for arch in amd64 386 arm64; do
            echo "== windows/$arch =="
            GOOS=windows GOARCH=$arch go build ./...
          done
          GOOS=windows GOARCH=amd64 go vet ./...
      - name: build binaries
        run: |
          go install github.com/tc-hib/go-winres@latest
          make res
          make agent helper
      - uses: actions/upload-artifact@v4
        with:
          name: winsvr-binaries
          path: dist/*
